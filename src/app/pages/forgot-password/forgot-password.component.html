<div class="form-container">  
  <form (ngSubmit)="onSubmit()" #forgotPasswordForm="ngForm">
    <div class="form-group">
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" [(ngModel)]="email" required email #emailInput="ngModel">
    </div>
    
    <button type="submit" [disabled]="!forgotPasswordForm.form.valid">Enviar link</button>
  </form>
</div>
